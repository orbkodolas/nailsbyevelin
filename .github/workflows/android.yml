name: Android APK
# Kézi indítás (Actions → Android APK → Run workflow) vagy v* tag pusholásakor.
# A kimenet a debug kulccsal aláírt release APK; a végleges aláírás helyben történik.
on:
  workflow_dispatch:
  push: { tags: ['v*'] }
permissions: { contents: read }
concurrency: { group: android-apk, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: expo-app } }
    # Az APK-ba épített admin eszközkulcs (a szerveren csak a lenyomata van); a JS-csomag a Gradle lépésben készül
    env: { EXPO_PUBLIC_ADMIN_KEY: '${{ secrets.NBE_APK_KEY }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: expo-app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: echo "$GOOGLE_SERVICES_JSON" > google-services.json
        env: { GOOGLE_SERVICES_JSON: "${{ secrets.GOOGLE_SERVICES_JSON }}" }
      - run: npx expo prebuild --platform android --no-install
      - name: Gradle assembleRelease
        working-directory: expo-app/android
        # Gyorsítás: csak 64 bites ARM (2017 utáni telefonok), Gradle build cache (setup-gradle menti), lint kihagyva
        run: ./gradlew assembleRelease --no-daemon --build-cache -x lintVitalRelease -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: nailsbyevelin-admin-apk
          path: expo-app/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
