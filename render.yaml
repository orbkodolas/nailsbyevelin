# Render Blueprint: a backend (Node). Az adatok a Neon Postgresben vannak (DATABASE_URL); enélkül JSON-fájl, ami ingyenes csomagon újraindításkor törlődik.
services:
  - type: web
    name: nailsbyevelin-api
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend --omit=dev
    startCommand: node backend/src/server.js
    healthCheckPath: /health
    envVars:
      - { key: ADMIN_TOKEN, generateValue: true }
      - { key: TRUST_PROXY, value: '1' }
      - { key: PUBLIC_URL, value: 'https://orbkodolas.github.io/nailsbyevelin' }
      - { key: CORS_ORIGIN, value: 'https://orbkodolas.github.io' }
      - { key: API_URL, sync: false }          # a service saját https://….onrender.com címe
      - { key: FORMSUBMIT_EMAIL, sync: false }
      - { key: DATABASE_URL, sync: false }     # Neon kapcsolódási cím (pooler), titkos
